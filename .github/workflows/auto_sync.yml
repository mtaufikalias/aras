name: Kemas Kini Data & Vektor AI ARAS

on:
  schedule:
    - cron: '0 19 * * *' # Jalan automatik setiap hari jam 3:00 AM waktu Malaysia
  workflow_dispatch:      # Membolehkan jalan secara manual bila-bila masa

permissions:
  contents: write

jobs:
  build-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Sediakan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang pustaka keperluan
        run: |
          pip install requests beautifulsoup4 sentence-transformers numpy

      - name: Tarik data MOF & Jana Vektor AI
        run: |
          python scripts/update_data.py

      - name: Simpan perubahan ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_terkini.json vectors.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-kemas kini data MOF & indeks vektor AI" && git push)
