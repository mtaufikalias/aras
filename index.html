<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARAS — Antaramuka Rujukan Aset &amp; Stok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card-hover { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#0f172a] text-white border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-600/30 shrink-0">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-extrabold tracking-tight">ARAS</h1>
            <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-400/20">1PP / MOF</span>
          </div>
          <p class="text-xs text-slate-400">Antaramuka Rujukan Aset &amp; Stok</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 text-xs">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/90 border border-slate-700 text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Dikemaskini: <strong id="metaUpdated" class="text-white font-semibold">Memuatkan...</strong></span>
          <span class="text-slate-600">|</span>
          <span>Jumlah Rekod: <strong id="metaTotal" class="text-white font-semibold">0</strong></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Search & Filters -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-7">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 mb-6">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z"/>
          </svg>
        </div>
        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Cari nama barang, kod aset, atau stok (cth: kerusi, komputer, induction cooker)..."
          class="w-full pl-12 pr-12 py-3.5 text-sm sm:text-base bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
        />
        <button id="clearBtn" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600" title="Padam carian">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Category Filter Pills -->
      <div class="flex flex-wrap items-center gap-2 mt-4" id="filterBar">
        <button data-filter="Semua" class="filter-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm transition">
          Semua (<span id="countSemua">0</span>)
        </button>
        <button data-filter="Aset Alih" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
          Aset Alih (<span id="countAlih">0</span>)
        </button>
        <button data-filter="Aset Tak Alih" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
          Aset Tak Alih (<span id="countTakAlih">0</span>)
        </button>
        <button data-filter="Aset Tak Ketara" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
          Aset Tak Ketara (<span id="countTakKetara">0</span>)
        </button>
        <button data-filter="Stok" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
          Stok (<span id="countStok">0</span>)
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4 px-1">
      <p id="resultSummary" class="text-xs sm:text-sm text-slate-500">Memuatkan pangkalan data...</p>
      <span id="aiStatusBadge" class="hidden inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-ping"></span>
        <span id="aiStatusText">Menganalisis padanan semantik...</span>
      </span>
    </div>

    <!-- Results Grid -->
    <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200">
      <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h3 class="text-sm font-bold text-slate-800">Tiada rekod ditemui</h3>
      <p class="text-xs text-slate-500 mt-1 max-w-md mx-auto">Cuba gunakan kata kunci yang lebih umum atau semak ejaan perkataan anda.</p>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5">
      <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      <span id="toastMsg">Kod berjaya disalin!</span>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;

    let allRecords = [];
    let semanticVectors = [];
    let embedder = null;
    let currentFilter = 'Semua';
    let searchTimeout = null;

    // Lapisan 2: Kamus Sinonim Pantas (0.01 saat)
    const SYNONYMS = {
      'induction cooker': ['dapur elektrik', 'periuk'],
      'air fryer': ['ketuhar', 'penggoreng'],
      'rice cooker': ['periuk nasi'],
      'water dispenser': ['penapis air', 'dispenser air'],
      'coway': ['penapis air'],
      'cuckoo': ['penapis air'],
      'laptop': ['komputer riba'],
      'notebook': ['komputer riba'],
      'pc': ['komputer meja', 'desktop'],
      'printer': ['pencetak'],
      'scanner': ['pengimbas'],
      'projector': ['projektor'],
      'powerbank': ['bateri', 'pengecas'],
      'thumbdrive': ['pemacu kilat', 'storan'],
      'pendrive': ['pemacu kilat', 'storan'],
      'aircond': ['penyaman udara', 'hawa dingin'],
      'air cond': ['penyaman udara', 'hawa dingin'],
      'cctv': ['kamera litar tertutup'],
      'walkie talkie': ['radio dua hala'],
      'drone': ['pesawat tanpa pemandu', 'uav'],
      'whiteboard': ['papan putih'],
      'shredder': ['mesin perincih kertas']
    };

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultsGrid = document.getElementById('resultsGrid');
    const emptyState = document.getElementById('emptyState');
    const resultSummary = document.getElementById('resultSummary');
    const aiStatusBadge = document.getElementById('aiStatusBadge');
    const aiStatusText = document.getElementById('aiStatusText');

    async function init() {
      try {
        const res = await fetch('data_terkini.json');
        const data = await res.json();
        allRecords = data.records || [];

        document.getElementById('metaUpdated').textContent = data.updated_at || '-';
        document.getElementById('metaTotal').textContent = allRecords.length.toLocaleString('ms-MY');

        updateCounts();
        renderRecords(allRecords.slice(0, 30), false);
        resultSummary.innerHTML = `Menunjukkan <strong>30</strong> daripada <strong>${allRecords.length.toLocaleString('ms-MY')}</strong> rekod`;

        // Muat fail vektor semantik secara senyap di belakang tabir
        fetch('vectors.json')
          .then(r => r.ok ? r.json() : null)
          .then(vData => {
            if (vData && vData.items) semanticVectors = vData.items;
          })
          .catch(() => {});
      } catch (err) {
        resultSummary.textContent = 'Gagal memuatkan pangkalan data.';
      }
    }

    function updateCounts() {
      let alih = 0, takAlih = 0, takKetara = 0, stok = 0;
      for (const r of allRecords) {
        if (r.jenis === 'Aset Alih') alih++;
        else if (r.jenis === 'Aset Tak Alih') takAlih++;
        else if (r.jenis === 'Aset Tak Ketara') takKetara++;
        else if (r.jenis === 'Stok') stok++;
      }
      document.getElementById('countSemua').textContent = allRecords.length.toLocaleString('ms-MY');
      document.getElementById('countAlih').textContent = alih.toLocaleString('ms-MY');
      document.getElementById('countTakAlih').textContent = takAlih.toLocaleString('ms-MY');
      document.getElementById('countTakKetara').textContent = takKetara.toLocaleString('ms-MY');
      document.getElementById('countStok').textContent = stok.toLocaleString('ms-MY');
    }

    function filterByJenis(list) {
      if (currentFilter === 'Semua') return list;
      return list.filter(r => r.jenis === currentFilter);
    }

    function cosineSimilarity(vecA, vecB) {
      let dot = 0;
      for (let i = 0; i < vecA.length; i++) dot += vecA[i] * vecB[i];
      return dot; // Vektor sudah dinormalisasi
    }

    async function performSearch() {
      const rawQuery = searchInput.value.trim();
      clearBtn.classList.toggle('hidden', !rawQuery);
      aiStatusBadge.classList.add('hidden');

      if (!rawQuery) {
        const filtered = filterByJenis(allRecords);
        renderRecords(filtered.slice(0, 30), false);
        resultSummary.innerHTML = `Menunjukkan <strong>${Math.min(30, filtered.length)}</strong> daripada <strong>${filtered.length.toLocaleString('ms-MY')}</strong> rekod`;
        return;
      }

      const q = rawQuery.toLowerCase();
      const basePool = filterByJenis(allRecords);

      // LAPISAN 1: Carian Tepat & Kata Kunci
      let exactMatches = basePool.filter(r =>
        r.nama.toLowerCase().includes(q) ||
        r.kod.toLowerCase().includes(q) ||
        r.kategori.toLowerCase().includes(q) ||
        r.keterangan.toLowerCase().includes(q)
      );

      if (exactMatches.length > 0) {
        renderRecords(exactMatches.slice(0, 60), false);
        resultSummary.innerHTML = `Menunjukkan <strong>${Math.min(60, exactMatches.length)}</strong> daripada <strong>${exactMatches.length.toLocaleString('ms-MY')}</strong> rekod ditemui`;
        return;
      }

      // LAPISAN 2: Kamus Sinonim Tempatan
      let synonymTerms = [];
      for (const [key, vals] of Object.entries(SYNONYMS)) {
        if (q.includes(key) || key.includes(q)) {
          synonymTerms.push(...vals);
        }
      }

      if (synonymTerms.length > 0) {
        const synMatches = basePool.filter(r => {
          const hay = `${r.nama} ${r.kategori}`.toLowerCase();
          return synonymTerms.some(term => hay.includes(term));
        });
        if (synMatches.length > 0) {
          renderRecords(synMatches.slice(0, 10), true);
          resultSummary.innerHTML = `Tiada padanan tepat untuk "<strong>${escapeHtml(rawQuery)}</strong>" — memaparkan <strong>${Math.min(10, synMatches.length)}</strong> cadangan <strong>Padanan Hampir</strong>`;
          return;
        }
      }

      // LAPISAN 3: Embedded Neural AI (Transformers.js + vectors.json)
      if (semanticVectors.length > 0) {
        try {
          aiStatusBadge.classList.remove('hidden');
          aiStatusText.textContent = embedder ? 'Menganalisis maksud semantik...' : 'Memuatkan enjin AI pelayar (kali pertama)...';

          if (!embedder) {
            embedder = await pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2');
          }

          aiStatusText.textContent = 'Mencari pengelasan MOF paling hampir...';
          const output = await embedder(rawQuery, { pooling: 'mean', normalize: true });
          const queryVec = Array.from(output.data);

          const scored = semanticVectors.map(item => ({
            kategori: item.k,
            score: cosineSimilarity(queryVec, item.v)
          }));

          scored.sort((a, b) => b.score - a.score);
          const topCategories = scored.slice(0, 4).filter(s => s.score > 0.35).map(s => s.kategori);

          aiStatusBadge.classList.add('hidden');

          if (topCategories.length > 0) {
            const aiMatches = basePool.filter(r => topCategories.includes(r.kategori)).slice(0, 10);
            if (aiMatches.length > 0) {
              renderRecords(aiMatches, true);
              resultSummary.innerHTML = `Tiada padanan tepat untuk "<strong>${escapeHtml(rawQuery)}</strong>" — memaparkan <strong>${aiMatches.length}</strong> cadangan <strong>Padanan Hampir</strong>`;
              return;
            }
          }
        } catch (e) {
          aiStatusBadge.classList.add('hidden');
        }
      }

      renderRecords([], false);
      resultSummary.innerHTML = `Tiada rekod ditemui untuk "<strong>${escapeHtml(rawQuery)}</strong>"`;
    }

    function getBadgeStyle(jenis) {
      if (jenis === 'Aset Alih') return 'bg-blue-50 text-blue-700 border-blue-200';
      if (jenis === 'Aset Tak Alih') return 'bg-purple-50 text-purple-700 border-purple-200';
      if (jenis === 'Aset Tak Ketara') return 'bg-amber-50 text-amber-700 border-amber-200';
      return 'bg-emerald-50 text-emerald-700 border-emerald-200';
    }

    function renderRecords(list, isFuzzy) {
      resultsGrid.innerHTML = '';
      if (!list || list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const fragment = document.createDocumentFragment();
      list.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-slate-200/90 p-4 flex flex-col justify-between card-hover';

        const desc = item.keterangan || 'Tiada keterangan tambahan.';
        const isLong = desc.length > 130;
        const shortDesc = isLong ? desc.slice(0, 130) + '...' : desc;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="mono text-xs font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-800 border border-slate-200/80">${escapeHtml(item.kod)}</span>
                ${isFuzzy ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-amber-50 text-amber-700 border border-amber-200">Padanan Hampir</span>` : ''}
              </div>
              <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full border shrink-0 ${getBadgeStyle(item.jenis)}">${escapeHtml(item.jenis)}</span>
            </div>

            <h3 class="text-sm font-bold text-slate-900 leading-snug mb-1.5">${escapeHtml(item.nama)}</h3>
            <p class="text-[11px] font-medium text-slate-500 uppercase tracking-wide mb-3 line-clamp-1" title="${escapeHtml(item.kategori)}">${escapeHtml(item.kategori)}</p>

            <div class="text-xs text-slate-600 leading-relaxed mb-4">
              <p id="desc-${idx}">${escapeHtml(shortDesc)}</p>
              ${isLong ? `<button type="button" data-idx="${idx}" data-full="${escapeAttr(desc)}" data-short="${escapeAttr(shortDesc)}" class="toggle-desc mt-1 text-blue-600 hover:text-blue-800 font-semibold text-[11px]">Lihat penuh</button>` : ''}
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 flex justify-end">
            <button type="button" data-kod="${escapeAttr(item.kod)}" class="copy-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-blue-600 text-white text-xs font-semibold transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              Salin Kod
            </button>
          </div>
        `;
        fragment.appendChild(card);
      });
      resultsGrid.appendChild(fragment);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function escapeAttr(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2200);
    }

    resultsGrid.addEventListener('click', e => {
      const copyBtn = e.target.closest('.copy-btn');
      if (copyBtn) {
        const kod = copyBtn.getAttribute('data-kod');
        navigator.clipboard.writeText(kod);
        showToast(`Kod ${kod} berjaya disalin!`);
        return;
      }

      const toggleBtn = e.target.closest('.toggle-desc');
      if (toggleBtn) {
        const idx = toggleBtn.getAttribute('data-idx');
        const p = document.getElementById(`desc-${idx}`);
        const expanded = toggleBtn.textContent === 'Ringkaskan';
        p.textContent = expanded ? toggleBtn.getAttribute('data-short') : toggleBtn.getAttribute('data-full');
        toggleBtn.textContent = expanded ? 'Lihat penuh' : 'Ringkaskan';
      }
    });

    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
        b.classList.add('bg-slate-100', 'text-slate-600');
      });
      btn.classList.remove('bg-slate-100', 'text-slate-600');
      btn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
      currentFilter = btn.getAttribute('data-filter');
      performSearch();
    });

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(performSearch, 250);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      performSearch();
      searchInput.focus();
    });

    init();
  </script>
</body>
</html>
